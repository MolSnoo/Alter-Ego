name: TypeScript Check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ">=24.14.1"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run compile